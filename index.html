<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Книга</title>
    <style>
        /* Новый глубокий переливающийся черный фон */
        body { 
            font-family: 'Georgia', serif; 
            background: radial-gradient(circle, #1a1a1a 0%, #0d0d0d 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        
        /* Книга со стильной кожаной текстурой и золотой рамкой */
        .book { 
            background: #fff; 
            width: 100%; 
            max-width: 950px; 
            height: 600px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); 
            border-radius: 6px; 
            display: flex; 
            position: relative; 
            border: 6px solid #4a3321;
            outline: 2px solid #dfcbb5;
            outline-offset: -5px;
        }
        
        /* Страницы внутри раскрытой книги */
        .page-left, .page-right { 
            width: 50%; 
            padding: 45px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            position: relative; 
            background: linear-gradient(to right, #fdfbf7 94%, #eadecc 100%); 
        }
        .page-right {
            background: linear-gradient(to left, #fdfbf7 94%, #eadecc 100%);
        }
        .page-left { border-right: 2px solid rgba(0,0,0,0.15); }
        
        .content { flex-grow: 1; overflow-y: auto; font-size: 19px; line-height: 1.7; color: #222; }
        .content h3 { color: #8b5a2b; font-size: 22px; border-bottom: 1px dashed #dfcbb5; padding-bottom: 8px; margin-top: 0; }
        
        /* Новая обложка с золотым тиснением и крутым стилем текста */
        .cover { 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(135deg, #3d2314 0%, #2b180d 100%);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 40px; 
            box-sizing: border-box; 
            position: absolute; 
            z-index: 10; 
            transition: transform 0.6s; 
        }
        .cover .decor-frame {
            border: 2px solid #dfcbb5;
            padding: 40px 30px;
            border-radius: 4px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
            max-width: 500px;
        }
        .cover h1 { 
            font-size: 34px; 
            margin: 0 0 15px 0; 
            font-weight: normal; 
            color: #f7e1c1;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.6);
            letter-spacing: 1px;
        }
        .cover p { 
            font-size: 18px; 
            font-style: italic; 
            color: #bfa385; 
            margin: 0 0 35px 0; 
        }
        
        /* Красивые кнопки */
        .btn { 
            background: linear-gradient(to bottom, #f7e1c1 0%, #dfcbb5 100%);
            color: #3d2314; 
            border: 1px solid #aa8d6f; 
            padding: 14px 40px; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 4px; 
            font-weight: bold; 
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        .btn:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.4); }
        
        .nav-buttons { display: flex; justify-content: space-between; width: 100%; margin-top: 20px; }
        .nav-btn { background: none; border: none; font-size: 16px; color: #8b5a2b; cursor: pointer; font-weight: bold; padding: 5px 10px; }
        .nav-btn:hover { color: #222; text-decoration: underline; }
        
        /* Список Ориентира */
        .orientir-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .orientir-list li { cursor: pointer; color: #8b5a2b; font-size: 16px; transition: color 0.2s; padding: 4px 8px; border-radius: 4px; }
        .orientir-list li:hover { color: #222; background: #f0eae1; text-decoration: underline; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="book">
    <!-- ОБЛОЖКА -->
    <div id="cover" class="cover">
        <div class="decor-frame">
            <h1>«я не знаю как эта назвать атстань»</h1>
            <p>Если я далеко — прочитай</p>
            <button class="btn" onclick="openBook()">Открыть книгу</button>
        </div>
    </div>

    <!-- ЛЕВАЯ СТРАНИЦА -->
    <div class="page-left">
        <div id="left-content" class="content"></div>
        <div class="nav-buttons">
            <button id="btn-prev" class="nav-btn" onclick="prevPage()">← Назад</button>
            <span></span>
        </div>
    </div>

    <!-- ПРАВАЯ СТРАНИЦА -->
    <div class="page-right">
        <div id="right-content" class="content"></div>
        <div class="nav-buttons">
            <span></span>
            <button id="btn-next" class="nav-btn" onclick="nextPage()">Вперед →</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // ТЕКСТ ТВОЕЙ КНИГИ НАСТРАИВАЕТСЯ ТУТ:
    // ==========================================
    const bookData = {
        1: {
            left: "<h3>Страница 1</h3><p>Привет! Это начало первой страницы слева.</p>",
            right: "<h3>Страница 1</h3><p>А это продолжение первой страницы на правой стороне.</p>"
        },
        2: {
            left: "<h3>Страница 2</h3><p>Тут текст для второй страницы (левая часть).</p>",
            right: "<h3>Страница 2</h3><p>Тут текст для второй страницы (правая часть).</p>"
        },
        3: {
            left: "<h3>Страница 3</h3><p>Текст третьей страницы слева...</p>",
            right: "<h3>Страница 3</h3><p>Текст третьей страницы справа...</p>"
        }
    };
    // ==========================================

    let currentPage = 0; 
    
    let orientirHtml = '<h3>Ориентир</h3><ul class="orientir-list">';
    for(let i = 1; i <= 51; i++) {
        orientirHtml += `<li onclick="goToPage(${i})">📖 ${i} страница</li>`;
    }
    orientirHtml += '</ul>';

    function openBook() {
        document.getElementById('cover').classList.add('hidden');
        renderPage();
    }

    function goToPage(pageNum) {
        currentPage = pageNum;
        renderPage();
    }

    function prevPage() {
        if (currentPage > 0) {
            currentPage--;
            renderPage();
        } else {
            document.getElementById('cover').classList.remove('hidden');
        }
    }

    function nextPage() {
        if (currentPage < 51) {
            currentPage++;
            renderPage();
        }
    }

    function renderPage() {
        const left = document.getElementById('left-content');
        const right = document.getElementById('right-content');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        if (currentPage === 0) {
            left.innerHTML = ''; 
            right.innerHTML = orientirHtml;
            btnPrev.innerText = "← На обложку";
            btnNext.classList.add('hidden'); 
        } else {
            btnNext.classList.remove('hidden');
            btnPrev.innerText = "← Назад";
            
            if (bookData[currentPage]) {
                left.innerHTML = bookData[currentPage].left;
                right.innerHTML = bookData[currentPage].right;
            } else {
                left.innerHTML = `<h3>Страница ${currentPage}</h3><p>Здесь будет твой текст для левой страницы.</p>`;
                right.innerHTML = `<h3>Страница ${currentPage}</h3><p>Здесь будет твой текст для правой страницы.</p>`;
            }
            
            if (currentPage === 51) {
                btnNext.classList.add('hidden');
            }
        }
    }
</script>

</body>
</html>
