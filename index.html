<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Книга</title>
    <style>
        body { 
            font-family: 'Georgia', serif; 
            background: radial-gradient(circle, #1a1a1a 0%, #0d0d0d 100%); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; overflow: hidden;
        }
        .book { 
            background: #fff; width: 100%; max-width: 950px; height: 600px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); border-radius: 6px; 
            display: flex; position: relative; border: 6px solid #4a3321;
            outline: 2px solid #dfcbb5; outline-offset: -5px; overflow: hidden;
        }
        .cover { 
            width: 100%; height: 100%; background: linear-gradient(135deg, #2b180d 0%, #150b06 100%);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8); color: #fff; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            text-align: center; padding: 40px; box-sizing: border-box; position: absolute; 
            z-index: 10;
        }
        .decor-frame { 
            border: 2px solid #dfcbb5; padding: 40px 30px; border-radius: 4px; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4); max-width: 500px; 
            background: rgba(0, 0, 0, 0.2);
        }
        .cover h1 { font-size: 34px; margin: 0 0 15px 0; color: #f7e1c1; text-shadow: 0px 2px 4px rgba(0,0,0,0.6); }
        .cover p { font-size: 18px; font-style: italic; color: #bfa385; margin: 0 0 20px 0; }
        
        .status-badge {
            display: inline-block;
            background: rgba(217, 83, 79, 0.15);
            color: #d9534f;
            border: 1px solid #d9534f;
            padding: 6px 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            margin-bottom: 35px;
            font-weight: bold;
        }

        .btn { 
            background: linear-gradient(to bottom, #5a4b41 0%, #44372e 100%); 
            color: #8c7665; 
            border: 1px solid #5a4b41; 
            padding: 14px 40px; font-size: 16px; 
            border-radius: 4px; font-weight: bold; 
            text-transform: uppercase; 
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>
<div class="book">
    <div id="cover" class="cover">
        <div class="decor-frame">
            <h1>«Путеводитель»</h1>
            <p>Книга завершена.</p>
            <div class="status-badge">Книга скрыта автором</div>
            <button class="btn" disabled>Открыть книгу</button>
        </div>
    </div>
</div>
</body>
</html>
